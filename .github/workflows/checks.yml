name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-optional.txt
      - name: Check syntax
        run: python -m compileall -q features.py download_data.py train.py predict.py app.py tests
      - name: Test features, training and app
        run: python -m unittest discover -s tests -v
